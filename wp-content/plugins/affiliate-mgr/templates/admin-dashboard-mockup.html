<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabbed Interface</title>
   
<link href="..\assets\css\admin-dashboard.css rel=" rel="stylesheet" type="text/css"/>

</head>
<body>

    <div class="tab-container">
        <div class="tab active" data-tab="clickbank" onclick="am.dashboard.showTab('clickbank')">Clickbank</div>
        <div class="tab" data-tab="amazon" onclick="am.dashboard.showTab('amazon')">Amazon</div>
    </div>
    
<div id="clickbank" class="tab-content active">
    <label>Clickbank Activity</label>
    <table class="wp-list-table widefat fixed striped">
        <thead>
            <tr>
                <th>Date</th>
                <th>Shortcode</th>
                <th>Campaign</th>
                <th>Category</th>
                <th>Redirects</th>
                <th>QR Code</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>2024-11-23</td>
                <td>CB123</td>
                <td>Holiday Sales</td>
                <td>Marketing</td>
                <td>120</td>
                <td><img src="..\assets\images\qrCodePlaceholder.png" alt="QR Code" width="50"></td>
            </tr>
        </tbody>
    </table>
</div>

<div id="amazon" class="tab-content">
    <label>Amazon Activity</label>
    <table>
        <thead>
            <tr>
                <th>Date</th>
                <th>Shortcode</th>
                <th>Campaign</th>
                <th>Category</th>
                <th>Redirects</th>
                <th>QR Code</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>2024-11-23</td>
                <td>AMZ456</td>
                <td>Prime Day</td>
                <td>E-commerce</td>
                <td>350</td>
                <td><img src="..\assets\images\qrCodePlaceholder.png" alt="QR Code" width="50"></td>
            </tr>
        </tbody>
    </table>
</div>

<script src="..\assets\js\am.dashboard.js" type="text/javascript"></script>

</body>
</html>
